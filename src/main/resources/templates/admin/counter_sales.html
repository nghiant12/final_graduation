<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="utf-8"/>
    <meta http-equiv="X-UA-Compatible" content="IE=edge"/>
    <meta name="viewport" content="width=device-width, initial-scale=1, shrink-to-fit=no"/>
    <meta name="description" content=""/>
    <meta name="author" content=""/>
    <title>Thương hiệu</title>
    <link href="https://cdn.jsdelivr.net/npm/simple-datatables@7.1.2/dist/style.min.css" rel="stylesheet"/>
    <link th:href="@{css/styles.css}" rel="stylesheet"/>
    <script src="https://use.fontawesome.com/releases/v6.3.0/js/all.js" crossorigin="anonymous"></script>
</head>
<body class="sb-nav-fixed">
<nav class="sb-topnav navbar navbar-expand navbar-dark bg-dark">
    <!-- Navbar Brand-->
    <a class="navbar-brand ps-3" href="index.html">Start Bootstrap</a>
    <!-- Sidebar Toggle-->
    <button class="btn btn-link btn-sm order-1 order-lg-0 me-4 me-lg-0" id="sidebarToggle" href="#!"><i
            class="fas fa-bars"></i></button>
    <!-- Navbar Search-->
    <form class="d-none d-md-inline-block form-inline ms-auto me-0 me-md-3 my-2 my-md-0">
        <div class="input-group">
            <input class="form-control" type="text" placeholder="Search for..." aria-label="Search for..."
                   aria-describedby="btnNavbarSearch"/>
            <button class="btn btn-primary" id="btnNavbarSearch" type="button"><i class="fas fa-search"></i></button>
        </div>
    </form>
    <!-- Navbar-->
    <ul class="navbar-nav ms-auto ms-md-0 me-3 me-lg-4">
        <li class="nav-item dropdown">
            <a class="nav-link dropdown-toggle" id="navbarDropdown" href="#" role="button" data-bs-toggle="dropdown"
               aria-expanded="false"><i class="fas fa-user fa-fw"></i></a>
            <ul class="dropdown-menu dropdown-menu-end" aria-labelledby="navbarDropdown">
                <li><a class="dropdown-item" href="#!">Settings</a></li>
                <li><a class="dropdown-item" href="#!">Activity Log</a></li>
                <li>
                    <hr class="dropdown-divider"/>
                </li>
                <li><a class="dropdown-item" href="#!">Logout</a></li>
            </ul>
        </li>
    </ul>
</nav>

<!-- Menu Sidebar -->
<div id="layoutSidenav">
    <div id="layoutSidenav_nav">
        <div th:replace="menu :: menu"></div> <!-- Sidebar Menu -->
    </div>

    <!-- Nội dung chính -->
    <div id="layoutSidenav_content">
        <main>
            <div class="container-fluid px-4">
                <h1 class="mt-4">Bán hàng</h1>
                <ol class="breadcrumb mb-4">
                    <li class="breadcrumb-item"><a th:href="@{/admin}">Dashboard</a></li>
                    <li class="breadcrumb-item active">Bán hàng</li>
                </ol>
                <div class="card mb-4">
                    <div class="card-body">
                        <div th:if="${error}" class="alert alert-danger" role="alert">
                            <span th:text="${error}">Lỗi</span>
                        </div>

                        <div th:if="${success}" class="alert alert-success" role="alert">
                            <span th:text="${success}">Thành công</span>
                        </div>
                        <div>
                            <button class="btn btn-success">Thêm hóa đơn</button>
                            <button class="btn btn-danger">Hủy hóa đơn</button>
                        </div>
                    </div>
                </div>
                <!-- Tabs -->
                <ul class="nav nav-tabs mb-4">
                    <li class="nav-item">
                        <a class="nav-link active" href="#">HD01</a>
                    </li>
                </ul>
                <!-- Product Section -->
                <div class="mb-4">
                    <h5>Sản phẩm</h5>
                    <div class="d-flex align-items-center border p-3 mb-3">
                        <img src="https://via.placeholder.com/100" alt="Product" class="me-3">
                        <div>
                            <h6>Đồng hồ A</h6>
                            <p class="text-danger">1.000.000 đ</p>
                        </div>
                        <div class="ms-auto d-flex align-items-center">
                            <button class="btn btn-outline-secondary me-2">-</button>
                            <span>1</span>
                            <button class="btn btn-outline-secondary ms-2">+</button>
                            <button class="btn btn-danger ms-3">Xóa</button>
                        </div>
                    </div>
                    <div>
                        <button class="btn btn-primary">Quét QR sản phẩm</button>
                        <button class="btn btn-secondary">Thêm sản phẩm</button>
                    </div>
                </div>
                <!-- Customer Section -->
                <div class="mb-4">
                    <h5>Khách hàng</h5>
                    <button class="btn btn-outline-primary">Chọn khách hàng</button>
                </div>
                <!-- Order Info -->
                <div class="border p-3">
                    <h5>Thông tin đơn hàng</h5>
                    <p>Tổng số tiền: <span class="text-danger">1.000.000 đ</span></p>
                    <button class="btn btn-primary w-100">Xác nhận đặt hàng</button>
                </div>
            </div>

        </main>
    </div>
</div>

<footer class="py-4 bg-light mt-auto">
    <div class="container-fluid px-4">
        <div class="d-flex align-items-center justify-content-between small">
            <div class="text-muted">Copyright &copy; Your Website 2023</div>
            <div>
                <a href="#">Privacy Policy</a>
                &middot;
                <a href="#">Terms & Conditions</a>
            </div>
        </div>
    </div>
</footer>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.2.3/dist/js/bootstrap.bundle.min.js"
        crossorigin="anonymous"></script>
<script th:src="@{js/scripts.js}"></script>
<script src="https://cdn.jsdelivr.net/npm/simple-datatables@7.1.2/dist/umd/simple-datatables.min.js"
        crossorigin="anonymous"></script>
<script th:src="@{js/datatables-simple-demo.js}"></script>
</body>
</html>
