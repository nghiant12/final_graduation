<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="utf-8"/>
    <meta http-equiv="X-UA-Compatible" content="IE=edge"/>
    <meta name="viewport" content="width=device-width, initial-scale=1, shrink-to-fit=no"/>
    <meta name="description" content=""/>
    <meta name="author" content=""/>
    <title>Khách hàng</title>
    <link href="https://cdn.jsdelivr.net/npm/simple-datatables@7.1.2/dist/style.min.css" rel="stylesheet"/>
    <link th:href="@{css/styles.css}" rel="stylesheet"/>
    <script src="https://use.fontawesome.com/releases/v6.3.0/js/all.js" crossorigin="anonymous"></script>
</head>
<body class="sb-nav-fixed">
<nav class="sb-topnav navbar navbar-expand navbar-dark bg-dark">
    <!-- Navbar Brand-->
    <a class="navbar-brand ps-3" href="index.html">Start Bootstrap</a>
    <!-- Sidebar Toggle-->
    <button class="btn btn-link btn-sm order-1 order-lg-0 me-4 me-lg-0" id="sidebarToggle" href="#!"><i
            class="fas fa-bars"></i></button>
    <!-- Navbar Search-->
    <form class="d-none d-md-inline-block form-inline ms-auto me-0 me-md-3 my-2 my-md-0">
        <div class="input-group">
            <input class="form-control" type="text" placeholder="Search for..." aria-label="Search for..."
                   aria-describedby="btnNavbarSearch"/>
            <button class="btn btn-primary" id="btnNavbarSearch" type="button"><i class="fas fa-search"></i></button>
        </div>
    </form>
    <!-- Navbar-->
    <ul class="navbar-nav ms-auto ms-md-0 me-3 me-lg-4">
        <li class="nav-item dropdown">
            <a class="nav-link dropdown-toggle" id="navbarDropdown" href="#" role="button" data-bs-toggle="dropdown"
               aria-expanded="false"><i class="fas fa-user fa-fw"></i></a>
            <ul class="dropdown-menu dropdown-menu-end" aria-labelledby="navbarDropdown">
                <li><a class="dropdown-item" href="#!">Settings</a></li>
                <li><a class="dropdown-item" href="#!">Activity Log</a></li>
                <li>
                    <hr class="dropdown-divider"/>
                </li>
                <li><a class="dropdown-item" href="#!">Logout</a></li>
            </ul>
        </li>
    </ul>
</nav>

<!-- Menu Sidebar -->
<div id="layoutSidenav">
    <div id="layoutSidenav_nav">
        <div th:replace="menu :: menu"></div>
    </div>

    <div id="layoutSidenav_content">
        <main>
            <div class="container-fluid px-4">
                <h1 class="mt-4">Quản lý khách hàng</h1>
                <ol class="breadcrumb mb-4">
                    <li class="breadcrumb-item"><a th:href="@{/admin}">Dashboard</a></li>
                    <li class="breadcrumb-item active">Khách hàng</li>
                </ol>

                <div class="card mb-4">
                    <div class="card-body">
                        <div th:if="${error}" class="alert alert-danger">Lỗi: <span th:text="${error}"></span></div>
                        <div th:if="${success}" class="alert alert-success">Thành công: <span th:text="${success}"></span></div>

                        <button class="btn btn-success mb-3" data-bs-toggle="modal" data-bs-target="#addAccountModal">Thêm khách hàng</button>

                        <!-- Modal Thêm khách hàng -->
                        <div class="modal fade" id="addAccountModal" tabindex="-1" aria-labelledby="addAccountLabel" aria-hidden="true">
                            <div class="modal-dialog">
                                <div class="modal-content">
                                    <div class="modal-header">
                                        <h5 class="modal-title" id="addAccountLabel">Thêm khách hàng</h5>
                                        <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
                                    </div>
                                    <div class="modal-body">
                                        <form th:action="@{/admin/customers/add}" method="post" th:object="${customer}">
                                            <div class="mb-3">
                                                <label class="form-label">Họ tên</label>
                                                <input type="text" class="form-control" th:field="*{fullname}" placeholder="Nhập họ tên" required/>
                                            </div>
                                            <div class="mb-3">
                                                <label class="form-label">Username</label>
                                                <input type="text" class="form-control" th:field="*{username}" placeholder="Nhập username" required/>
                                            </div>
                                            <div class="mb-3">
                                                <label class="form-label">Mật khẩu</label>
                                                <input type="password" class="form-control" th:field="*{password}" placeholder="Nhập mật khẩu" required/>
                                            </div>
                                            <div class="mb-3">
                                                <label class="form-label">Email</label>
                                                <input type="email" class="form-control" th:field="*{email}" placeholder="Nhập email" required/>
                                            </div>
                                            <div class="mb-3">
                                                <label class="form-label">Số điện thoại</label>
                                                <input type="text" class="form-control" th:field="*{phoneNumber}" placeholder="Nhập số điện thoại" required/>
                                            </div>
                                            <div class="mb-3">
                                                <label class="form-label">Địa chỉ</label>
                                                <input type="text" class="form-control" th:field="*{address}" placeholder="Nhập địa chỉ"/>
                                            </div>
                                            <!-- Ảnh đại diện -->
                                            <div class="mb-3">
                                                <label for="photo" class="form-label">Ảnh đại diện</label>
                                                <input type="file" class="form-control" id="" name="photo" accept="image/*" />
                                            </div>
                                            <div class="text-end">
                                                <button type="submit" class="btn btn-primary">Lưu</button>
                                            </div>
                                        </form>
                                    </div>
                                </div>
                            </div>
                        </div>

                        <!-- Modal Sửa khách hàng -->
                        <div class="modal fade" id="editAccountModal" tabindex="-1" aria-labelledby="editAccountLabel" aria-hidden="true">
                            <div class="modal-dialog">
                                <div class="modal-content">
                                    <div class="modal-header">
                                        <h5 class="modal-title" id="editAccountLabel">Sửa khách hàng</h5>
                                        <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
                                    </div>
                                    <div class="modal-body">
                                        <form th:action="@{/admin/customers/update}" method="post">
                                            <input type="hidden" name="id"/>
                                            <div class="mb-3">
                                                <label class="form-label">Họ tên</label>
                                                <input type="text" class="form-control" name="fullname" required/>
                                            </div>
                                            <div class="mb-3">
                                                <label class="form-label">Username</label>
                                                <input type="text" class="form-control" name="username" readonly/>
                                            </div>
                                            <div class="mb-3">
                                                <label class="form-label">Mật khẩu</label>
                                                <input type="password" class="form-control" name="password" readonly/>
                                            </div>
                                            <div class="mb-3">
                                                <label class="form-label">Email</label>
                                                <input type="email" class="form-control" name="email" readonly/>
                                            </div>
                                            <div class="mb-3">
                                                <label class="form-label">Số điện thoại</label>
                                                <input type="text" class="form-control" name="phone_number" readonly/>
                                            </div>
                                            <div class="mb-3">
                                                <label class="form-label">Địa chỉ</label>
                                                <input type="text" class="form-control" name="address"/>
                                            </div>
                                            <!-- Ảnh đại diện -->
                                            <div class="mb-3">
                                                <label for="photo" class="form-label">Ảnh đại diện</label>
                                                <input type="file" class="form-control" id="photo" name="photo" accept="image/*"/>
                                            </div>
                                            <div class="text-end">
                                                <button type="submit" class="btn btn-primary">Lưu</button>
                                            </div>
                                        </form>
                                    </div>
                                </div>
                            </div>
                        </div>


                        <div class="card mb-4">
                    <div class="card-header">
                        <i class="fas fa-table me-1"></i> Danh sách khách hàng
                    </div>
                    <div class="card-body">
                        <table id="datatablesSimple">
                            <thead>
                            <tr>
                                <th>STT</th>
                                <th>Họ tên</th>
                                <th>Username</th>
                                <th>Email</th>
                                <th>Sđt</th>
                                <th>Địa chỉ</th>
                                <th>Thao tác</th>
                            </tr>
                            </thead>
                            <tbody>
                            <tr th:each="customer, stat : ${customers}">
                                <td th:text="${stat.index + 1}"></td>
                                <td th:text="${customer.fullname}"></td>
                                <td th:text="${customer.username}"></td>
                                <td th:text="${customer.email}"></td>
                                <td th:text="${customer.phoneNumber}"></td>
                                <td th:text="${customer.address}"></td>
                                <td>
                                    <a href="#" class="text-dark" data-bs-toggle="modal" data-bs-target="#editAccountModal"
                                       th:attr="data-id=${customer.id}, data-username=${customer.username}, data-password=${customer.password},
                                       data-email=${customer.email}, data-fullname=${customer.fullname},
                                       data-phone_number=${customer.phoneNumber}, data-address=${customer.address}">
                                        <i class="fa-solid fa-pen"></i>
                                    </a>
                                </td>
                            </tr>
                            </tbody>
                        </table>
                    </div>
                </div>
            </div>
        </main>
    </div>
</div>

<footer class="py-4 bg-light mt-auto">
    <div class="container-fluid px-4">
        <div class="d-flex align-items-center justify-content-between small">
            <div class="text-muted">Copyright &copy; Your Website 2023</div>
            <div>
                <a href="#">Privacy Policy</a> &middot; <a href="#">Terms &amp; Conditions</a>
            </div>
        </div>
    </div>
</footer>

<script>
    document.addEventListener('DOMContentLoaded', function () {
        const editAccountModal = document.getElementById('editAccountModal');
        editAccountModal.addEventListener('show.bs.modal', function (event) {
            const button = event.relatedTarget;
            const id = button.getAttribute('data-id');
            const username = button.getAttribute('data-username');
            const email = button.getAttribute('data-email');
            const fullname = button.getAttribute('data-fullname');
            const address = button.getAttribute('data-address');
            const phoneNumber = button.getAttribute('data-phone_number');
            const password = button.getAttribute('data-password');

            const form = editAccountModal.querySelector('form');
            form.querySelector('input[name="id"]').value = id;
            form.querySelector('input[name="username"]').value = username;
            form.querySelector('input[name="email"]').value = email;
            form.querySelector('input[name="fullname"]').value = fullname;
            form.querySelector('input[name="phone_number"]').value = phoneNumber;
            form.querySelector('input[name="address"]').value = address;
            form.querySelector('input[name="password"]').value = password;
        });
    });
</script>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.2.3/dist/js/bootstrap.bundle.min.js"
        crossorigin="anonymous"></script>
<script th:src="@{js/scripts.js}"></script>
<script src="https://cdn.jsdelivr.net/npm/simple-datatables@7.1.2/dist/umd/simple-datatables.min.js"
        crossorigin="anonymous"></script>
<script th:src="@{js/datatables-simple-demo.js}"></script>
</body>
</html>
