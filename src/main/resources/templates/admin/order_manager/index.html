<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="utf-8"/>
    <meta http-equiv="X-UA-Compatible" content="IE=edge"/>
    <meta name="viewport" content="width=device-width, initial-scale=1, shrink-to-fit=no"/>
    <meta name="description" content=""/>
    <meta name="author" content=""/>
    <title>Hoá đơn</title>
    <link th:href="@{/admin/css/styles.css}" rel="stylesheet" type="text/css">
    <script src="https://use.fontawesome.com/releases/v6.3.0/js/all.js" crossorigin="anonymous"></script>
</head>
<body class="sb-nav-fixed">
<div th:replace="navbar :: navbar"></div>
<!-- Menu Sidebar -->
<div id="layoutSidenav">
    <div id="layoutSidenav_nav">
        <div th:replace="menu :: menu"></div> <!-- Sidebar Menu -->
    </div>
    <!-- Nội dung chính -->
    <div id="layoutSidenav_content">
        <main>
            <div class="container-fluid px-4">
                <h1 class="mt-4">Hóa đơn</h1>
                <ol class="breadcrumb mb-4">
                    <li class="breadcrumb-item"><a th:href="@{/admin}">Dashboard</a></li>
                    <li class="breadcrumb-item active">Hóa đơn</li>
                </ol>
                <div class="card mb-4">
                    <div class="card-header">
                        <i class="fas fa-filter"></i> Lọc hóa đơn
                    </div>
                    <div class="card-body">
                        <form id="filterForm" th:action="@{/admin/order-manager/filter}" method="get"
                              class="row g-3 align-items-end p-3 border rounded bg-light mt-3">

                            <!-- Ô chọn ngày bắt đầu -->
                            <div class="col-md-3">
                                <label for="startDate" class="form-label fw-bold">Từ ngày:</label>
                                <input type="date" id="startDate" name="startDate"
                                       th:value="${startDate}" class="form-control" required>
                            </div>

                            <!-- Ô chọn ngày kết thúc -->
                            <div class="col-md-3">
                                <label for="endDate" class="form-label fw-bold">Đến ngày:</label>
                                <input type="date" id="endDate" name="endDate"
                                       th:value="${endDate}" class="form-control" required>
                            </div>

                            <!-- Lọc theo loại hóa đơn -->
                            <div class="col-md-4">
                                <label class="form-label fw-bold">Loại hóa đơn:</label>
                                <div class="btn-group d-flex" role="group">
                                    <input type="radio" class="btn-check" name="type" value="" id="all"
                                           th:checked="${type == null or type == ''}" onchange="submitForm()">
                                    <label class="btn btn-outline-secondary w-100" for="all">Tất cả</label>

                                    <input type="radio" class="btn-check" name="type" value="At the counter"
                                           id="counter"
                                           th:checked="${type == 'At the counter'}" onchange="submitForm()">
                                    <label class="btn btn-outline-secondary w-100" for="counter">At the counter</label>

                                    <input type="radio" class="btn-check" name="type" value="Online" id="online"
                                           th:checked="${type == 'Online'}" onchange="submitForm()">
                                    <label class="btn btn-outline-secondary w-100" for="online">Online</label>
                                </div>
                            </div>

                            <!-- Nút Lọc và Reset -->
                            <div class="col-md-2 d-flex gap-2">
                                <button type="submit" class="btn btn-primary w-50">
                                    <i class="fas fa-filter"></i> Lọc
                                </button>
                                <a th:href="@{/admin/order-manager}" class="btn btn-secondary w-50">
                                    <i class="fas fa-sync-alt"></i> Reset
                                </a>
                            </div>
                        </form>
                    </div>
                </div>


                <script>
                    function submitForm() {
                        document.getElementById("filterForm").submit();
                    }
                </script>

                <div class="card mb-4">
                    <div class="card-header">
                        <i class="fas fa-table me-1"></i>
                        DataTable Example
                    </div>
                    <div class="card-body">
                        <table id="datatablesSimple" class="table table-bordered table-hover text-center align-middle">
                            <thead>
                            <tr>
                                <th>STT</th>
                                <th>Khách hàng</th>
                                <th>Nhân viên</th>
                                <th>Ngày tạo</th>
                                <th class="text-end">Tiền hàng</th>
                                <th class="text-end">Phí ship</th>
                                <th class="text-end">Giảm giá</th>
                                <th class="text-end">Tổng thanh toán</th>
                                <th class="text-end">Tổng tiền sau giảm</th>
                                <th>Phương thức thanh toán</th>
                                <th>Loại hóa đơn</th>
                                <th class="text-center">Trạng thái</th>
                                <th>Địa chỉ</th>
                                <th class="text-center">Thao tác</th>
                            </tr>
                            </thead>
                            <tbody>
                            <tr th:each="order, stat : ${orders}">
                                <td th:text="${stat.index + 1}"></td>
                                <td th:text="${order.customer != null ? order.customer.fullname : 'Chưa chọn khách hàng'}"></td>
                                <td th:text="${order.employee != null ? order.employee.fullname : 'Chưa chọn nhân viên'}"></td>
                                <td th:text="${#temporals.format(order.createdDate, 'dd/MM/yyyy HH:mm:ss')}"></td>
                                <td class="text-end" th:text="${#numbers.formatDecimal(order.subTotal, 0, 'COMMA', 0, 'POINT')} + ' VND'"></td>
                                <td class="text-end" th:text="${#numbers.formatDecimal(order.shippingFee, 0, 'COMMA', 0, 'POINT')} + ' VND'"></td>
                                <td class="text-end" th:text="|-${#numbers.formatDecimal(order.discountAmount, 0, 'COMMA', 0, 'POINT')} VND|"></td>
                                <td class="text-end" th:text="${#numbers.formatDecimal(order.totalPrice, 0, 'COMMA', 0, 'POINT')} + ' VND'" ></td>
                                <td class="text-end" th:text="${#numbers.formatDecimal(order.totalPrice, 0, 'COMMA', 0, 'POINT')} + ' VND'"></td>
                                <td th:text="${order.paymentMethod}"></td>
                                <td th:text="${order.type}"></td>
                                <td class="text-center" th:text="${order.status}"></td>
                                <td th:text="${order.address}"></td>
                                <td class="text-center">
                                    <a th:href="@{/admin/order-manager/detail(idOrder=${order.id})}"
                                       style="color: black; text-decoration: none">
                                        <i class="fa-solid fa-eye"></i>
                                    </a>
                                </td>
                            </tr>
                            </tbody>
                        </table>
                    </div>
                </div>
            </div>
        </main>
        <footer class="py-4 bg-light mt-auto">
            <div class="container-fluid px-4">
                <div class="d-flex align-items-center justify-content-between small">
                    <div class="text-muted">Copyright &copy; Your Website 2023</div>
                    <div>
                        <a href="#">Privacy Policy</a>
                        &middot;
                        <a href="#">Terms & Conditions</a>
                    </div>
                </div>
            </div>
        </footer>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.2.3/dist/js/bootstrap.bundle.min.js"
        crossorigin="anonymous"></script>
<script th:src="@{/admin/js/scripts.js}"></script>
<script src="https://cdn.jsdelivr.net/npm/simple-datatables@7.1.2/dist/umd/simple-datatables.min.js"
        crossorigin="anonymous"></script>
<script th:src="@{/admin/js/datatables-simple-demo.js}"></script>
</body>
</html>
