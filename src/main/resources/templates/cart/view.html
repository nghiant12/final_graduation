<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" th:replace="~{/layout/layout.html :: dynamic(~{::title},~{::body})}">

<head>
	<meta charset="ISO-8859-1">
	<title>Cart View</title>
	<script src="https://ajax.googleapis.com/ajax/libs/jquery/1.12.4/jquery.min.js"></script>
	<script src="https://code.jquery.com/ui/1.12.1/jquery-ui.min.js"></script>
</head>

<body>
	<div class="breadcrumb cart-breadcrumb">
		<a href="/">Trang chủ</a>
		<span>&nbsp;>&nbsp;</span>
		<a href="/product/list">Sản phẩm</a>
		<span>&nbsp;>&nbsp;</span>
		<span>Cart</span>
	</div>

	<section class="cart-section">
		<div class="table-responsive cart-table">
			<table class="w3-table-all">
				<thead>
				<tr class="w3-2021-inkwell">
					<th>STT</th>
					<th>Tên sản phẩm</th>
					<th>Hình ảnh</th>
					<th>Màu sắc</th>
					<th>Size</th>
					<th>Danh mục</th>
					<th>Giá</th>
					<th>Số lượng</th>
					<th>Tổng</th>
					<th>Hành động</th>
				</tr>
				</thead>
				<tbody id="cart-body">
				<!-- Dữ liệu giỏ hàng sẽ được thêm vào đây bằng JavaScript -->
				</tbody>
			</table>

			<div id="empty-cart" class="no-result-found" style="display: none;">
				<img src="/images/no-cart-image.png">
			</div>
		</div>


		<div class="cart-pay">
			<form id="order-form">
				<p class="w3-center">
					<b>THÔNG TIN ĐƠN HÀNG</b>
				</p>
				<input type="hidden" id="username" th:value="${username}">

				<p>
					<label>Số điện thoại</label>
					<input class="w3-input w3-border w3-round" name="sdt" id="user-sdt" th:value="${phone}" required>
				</p>

				<p>
					<label>Địa chỉ nhận hàng</label>
					<input class="w3-input w3-border w3-round" th:value="${address}" id="user-address" name="diachi" required>
				</p>

				<p>
					<label>Phương thức thanh toán</label>
					<select class="w3-select w3-border w3-round" name="option" onchange="changePayMethod(this)" id="payment">
						<option value="Cash">Thanh toán khi nhận hàng</option>
						<option value="Transfer">VN Pay</option>
					</select>
				</p>

				<p class="vn-pay">
					<input type="radio" id="ncb" name="bank" value="NCB" checked>
					<label for="ncb"><img src="/images/ncb.png" style="width: 70px;"></label>
					<input type="radio" id="eximbank" name="bank" value="EXIMBANK">
					<label for="eximbank"><img src="/images/eximbank.png" style="width: 70px;"></label>
				</p>

				<div>
					<b id="total-amount">Total: <span id="total-price">0 VND</span></b>
					<button type="button" class="pay-button" onclick="purchaseOrder()" id="order-btn">Đặt hàng</button>
					<p id="loading-message" style="display: none; color: red;">Đang xử lý đơn hàng...</p>
				</div>
			</form>

		</div>
	</section>
	<script>
		function changePayMethod(e) {
			if(e.value === '2') {
				$('.vn-pay').addClass('active');
			} else {
				$('.vn-pay').removeClass('active');
			}
		}
	</script>
	<script th:src="@{/admin/js/cartR.js}"></script>
</body>
</html>
