<head>
	<meta charset="utf-8">
	<title th:replace="${title}"></title>
	<meta http-equiv="X-UA-Compatible" content="IE=edge">
	<meta name="viewport" content="width=device-width, initial-scale=1">
	<meta name="viewport" content="initial-scale=1, maximum-scale=1">
	<link rel="stylesheet" href="https://www.w3schools.com/w3css/4/w3.css">
	<link rel="stylesheet" th:href="@{|/css/home.css|}">
	<link rel="stylesheet" th:href="@{|/css/list.css|}">
	<link rel="stylesheet" th:href="@{|/css/rangeSlider.css|}">
	<link rel="stylesheet" th:href="@{|/css/detail.css|}">
	<link rel="stylesheet" th:href="@{|/css/cart.css|}">
	<link rel="stylesheet" th:href="@{|/css/order_home.css|}">
	<link href='https://unpkg.com/boxicons@2.1.4/css/boxicons.min.css' rel='stylesheet'>

	<link rel="stylesheet" href="https://netdna.bootstrapcdn.com/font-awesome/4.0.3/css/font-awesome.css">
	<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/fancybox/2.1.5/jquery.fancybox.min.css"
		media="screen">
	<script src="https://kit.fontawesome.com/bf4e96c7b9.js" crossorigin="anonymous"></script>
	<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0-alpha1/dist/css/bootstrap.min.css" rel="stylesheet">
	<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0-alpha1/dist/js/bootstrap.bundle.min.js"> </script>
	<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/4.7.0/css/font-awesome.min.css">
	<script src="https://kit.fontawesome.com/bf4e96c7b9.js" crossorigin="anonymous"></script>

	<!------------------------------------------------------->
	<link rel="stylesheet" href="https://fonts.googleapis.com/css?family=Raleway">
	<link class="jsbin" href="http://ajax.googleapis.com/ajax/libs/jqueryui/1/themes/base/jquery-ui.css" rel="stylesheet" type="text/css" />
	<script class="jsbin" src="http://ajax.googleapis.com/ajax/libs/jquery/1/jquery.min.js"></script>
	<script class="jsbin" src="http://ajax.googleapis.com/ajax/libs/jqueryui/1.8.0/jquery-ui.min.js"></script>
	<link rel="stylesheet" href="https://fonts.googleapis.com/css?family=Roboto">
	<link rel="stylesheet" href="https://fonts.googleapis.com/css?family=Montserrat">
	<script src="https://ajax.googleapis.com/ajax/libs/angularjs/1.6.9/angular.min.js"></script>
	<script src="https://ajax.googleapis.com/ajax/libs/angularjs/1.6.9/angular-route.js"></script>
	<style>
        .order-card {
            border: 1px solid #ddd;
            border-radius: 8px;
            margin-bottom: 20px;
            transition: transform 0.2s;
        }
        .order-card:hover {
            transform: translateY(-5px);
            box-shadow: 0 4px 8px rgba(0,0,0,0.1);
        }
        .status-badge {
            padding: 5px 10px;
            border-radius: 15px;
            font-size: 0.9em;
        }
		.order-timeline {
            display: flex;
            justify-content: space-between;
            margin: 30px 0;
            position: relative;
        }
        .order-timeline::before {
            content: '';
            position: absolute;
            top: 25px;
            left: 0;
            right: 0;
            height: 2px;
            background: #ddd;
            z-index: 1;
        }
        .step {
            position: relative;
            z-index: 2;
            background: white;
            padding: 0 15px;
            text-align: center;
            opacity: 0.5;
        }
        .step.active {
            opacity: 1;
        }
        .step-icon {
            width: 50px;
            height: 50px;
            border-radius: 50%;
            background: #f8f9fa;
            border: 2px solid #ddd;
            display: flex;
            align-items: center;
            justify-content: center;
            margin: 0 auto 10px;
        }
        .active .step-icon {
            background: #007bff;
            border-color: #007bff;
            color: white;
        }
        .product-card {
            border: 1px solid #ddd;
            border-radius: 8px;
            padding: 15px;
            margin-bottom: 15px;
        }
        .product-image {
            width: 100px;
            height: 100px;
            object-fit: cover;
            border-radius: 4px;
        }
        .status-badge {
            padding: 5px 10px;
            border-radius: 15px;
            font-size: 0.9em;
        }
        .status-pending { background-color: #ffeeba; }
        .status-confirmed { background-color: #b8daff; }
        .status-preparing { background-color: #c3e6cb; }
        .status-shipping { background-color: #bee5eb; }
        .status-completed { background-color: #d4edda; }
        .status-cancelled { background-color: #f5c6cb; }
        .status-cancelled { background-color: #f5c6cb; }
    </style>
</head>


<body ng-app="cart" ng-controller="cart-ctrl">
	<nav th:insert="~{/layout/_menu.html:: navbar}"></nav>

	<main style="margin-top: 60px;">
		<main th:replace="${view}"></main>
	</main>

	<footer th:insert="~{/layout/footer.html}"></footer>

	<script th:src="@{|/js/cart.js|}"></script>
	<script th:src="@{/js/cart-r.js}"></script>
</body>

</html>
