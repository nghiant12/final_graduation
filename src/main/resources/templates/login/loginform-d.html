    <!-- Form Đăng Nhập -->
    <div class="form-container sign-in">
        <form th:action="@{/perform_login}" method="post">
            <h1>Sign In</h1>
            <div class="social-icons">
                <a href="#" class="icon"><i class="fa-brands fa-google-plus-g"></i></a>
                <a href="#" class="icon"><i class="fa-brands fa-facebook-f"></i></a>
                <a href="#" class="icon"><i class="fa-brands fa-github"></i></a>
                <a href="#" class="icon"><i class="fa-brands fa-linkedin-in"></i></a>
            </div>

            <!-- Hiển thị lỗi nếu đăng nhập thất bại -->
            <div th:if="${param.error}">
                <span style="color: red;">Invalid username or password.</span>
            </div>

            <!-- Hiển thị thông báo đăng nhập thành công -->
            <div th:if="${successMessage}">
                <span th:text="${successMessage}" style="color: green;"></span>
            </div>

            <input type="text" name="username" placeholder="Username" required>
            <input type="password" name="password" placeholder="Password" required>
            <a th:href="@{/signup}">Don't have an account? Sign up here !</a>
            <button type="submit">Sign In</button>
        </form>
    </div>

    <div class="toggle-container">
        <div class="toggle">
            <div class="toggle-panel toggle-left">
<!--                <h1>Welcome Back!</h1>-->
<!--                <p>Enter your personal details to use all of site features</p>-->
<!--                <button class="hidden" id="login">Sign In</button>-->
            </div>
            <div class="toggle-panel toggle-right">
                <h1>Hello, Friend!</h1>
                <a th:href="@{/signup}" style="color: white">Register with your personal details to use all of site features</a>
            </div>
        </div>
    </div>
</div>
