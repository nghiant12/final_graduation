<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      th:replace="~{/layout/layout.html :: dynamic(~{::title},~{::body})}">

<head>
    <meta charset="UTF-8"/>
    <meta name="viewport" content="width=device-width, initial-scale=1"/>
    <title>My profile</title>
    <link rel="stylesheet" href="https://www.w3schools.com/w3css/4/w3.css"/>
</head>

<body>
<div th:switch="${userType}">

    <!-- Form cho employee -->
    <form class="w3-container w3-light-grey user-container"
          th:case="'employee'"
          th:object="${user}"
          th:action="@{/profile/employee}"
          method="post">
        <!-- ADD THIS LINE -->
        <input type="hidden" th:field="*{username}"/>
        <input type="hidden" name="userType" th:value="'employee'"/>
        <h2>Hồ sơ nhân viên</h2>
        <p th:if="${error}" style="color:red;" th:text="${error}"></p>
        <p th:if="${success}" style="color:green;" th:text="${success}"></p>

        <p>
            <label>Họ và tên</label>
            <input class="w3-input w3-border w3-round-large" type="text" th:field="*{fullname}" required/>
        </p>
        <p>
            <label>Email</label>
            <input class="w3-input w3-border w3-round-large" type="email" th:field="*{email}" required/>
        </p>
        <p>
            <label>Số điện thoại</label>
            <input class="w3-input w3-border w3-round-large" type="tel" th:field="*{phoneNumber}" required/>
        </p>
        <p>
            <label>Địa chỉ</label>
            <input class="w3-input w3-border w3-round-large" type="text" th:field="*{address}"/>
        </p>
        <p>
            <label>Mật khẩu</label>
        <div style="position: relative;">
            <input class="w3-input w3-border w3-round-large"
                   type="password"
                   th:field="*{password}"
                   id="employeePasswordField"/>
            <i class="fa-solid fa-eye"
               id="employeeTogglePassword"
               style="position:absolute; top:12px; right:15px; cursor:pointer;"></i>
        </div>
        </p>

        <p>
            <button class="w3-btn w3-round-large w3-green" type="submit">Cập nhật</button>
        </p>
    </form>

    <!-- Form cho customer -->
    <form class="w3-container w3-light-grey user-container"
          th:case="'customer'"
          th:object="${user}"
          th:action="@{/profile/customer}"
          method="post">
        <!-- ADD THIS LINE -->
        <input type="hidden" th:field="*{username}"/>
        <input type="hidden" name="userType" th:value="'customer'"/>
        <h2>Hồ sơ khách hàng</h2>
        <p th:if="${error}" style="color:red;" th:text="${error}"></p>
        <p th:if="${success}" style="color:green;" th:text="${success}"></p>

        <p>
            <label>Họ và tên</label>
            <input class="w3-input w3-border w3-round-large" type="text" th:field="*{fullname}" required/>
        </p>
        <p>
            <label>Email</label>
            <input class="w3-input w3-border w3-round-large" type="email" th:field="*{email}" required/>
        </p>
        <p>
            <label>Số điện thoại</label>
            <input class="w3-input w3-border w3-round-large" type="tel" th:field="*{phoneNumber}" required/>
        </p>
        <p>
            <label>Địa chỉ</label>
            <input class="w3-input w3-border w3-round-large" type="text" th:field="*{address}"/>
        </p>
        <p>
            <label>Mật khẩu</label>
        <div style="position: relative;">
            <input class="w3-input w3-border w3-round-large"
                   type="password"
                   th:field="*{password}"
                   id="passwordField"/>
            <i class="fa-solid fa-eye"
               id="togglePassword"
               style="position:absolute; top:12px; right:15px; cursor:pointer;"></i>
        </div>
        </p>
        <p>
            <button class="w3-btn w3-round-large w3-green" type="submit">Cập nhật</button>
        </p>
    </form>

</div>
<script>
    // Customer toggle
    const toggle = document.getElementById("togglePassword");
    const passwordField = document.getElementById("passwordField");

    if (toggle && passwordField) {
        toggle.addEventListener("click", function () {
            const type = passwordField.getAttribute("type") === "password" ? "text" : "password";
            passwordField.setAttribute("type", type);
            this.classList.toggle("fa-eye");
            this.classList.toggle("fa-eye-slash");
        });
    }

    // Employee toggle
    const toggleEmp = document.getElementById("employeeTogglePassword");
    const passwordEmpField = document.getElementById("employeePasswordField");

    if (toggleEmp && passwordEmpField) {
        toggleEmp.addEventListener("click", function () {
            const type = passwordEmpField.getAttribute("type") === "password" ? "text" : "password";
            passwordEmpField.setAttribute("type", type);
            this.classList.toggle("fa-eye");
            this.classList.toggle("fa-eye-slash");
        });
    }
</script>
</body>
</html>
