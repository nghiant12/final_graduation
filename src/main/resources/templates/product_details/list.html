<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org" th:replace="~{/layout/layout.html :: dynamic(~{::title},~{::body})}">
<head>
    <meta charset="utf-8"/>
    <meta http-equiv="X-UA-Compatible" content="IE=edge"/>
    <meta name="viewport" content="width=device-width, initial-scale=1, shrink-to-fit=no"/>
    <meta name="description" content=""/>
    <meta name="author" content=""/>
    <title>Chi tiết sản phẩm</title>
    <link href="https://cdn.jsdelivr.net/npm/simple-datatables@7.1.2/dist/style.min.css" rel="stylesheet"/>
    <link th:href="@{/css/styles.css}" rel="stylesheet"/>
    <script src="https://use.fontawesome.com/releases/v6.3.0/js/all.js" crossorigin="anonymous"></script>
    <script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>

</head>
<body class="sb-nav-fixed">
<!-- Navbar and Sidebar code here -->

<div id="layoutSidenav_content">
    <main>
        <div class="container-fluid px-4">
            <h1 class="mt-4">Chi tiết sản phẩm</h1>
            <ol class="breadcrumb mb-4">
                <li class="breadcrumb-item"><a th:href="@{/admin}">Dashboard</a></li>
                <li class="breadcrumb-item active">Chi tiết sản phẩm</li>
            </ol>
            <div class="card mb-4">
                <div class="card-body">
                    <button type="button" class="btn btn-primary" data-bs-toggle="modal" data-bs-target="#addProductDetailModal">
                        Add New Product Detail
                    </button>
                    <table id="productDetailTable" class="table">
                        <thead>
                        <tr>
                            <th>ID</th>
                            <th>Sản phẩm</th>
                            <th>Hình ảnh</th>
                            <th>Giá</th>
                            <th>Số lượng</th>
                            <th>Ngày tạo</th>
                            <th>Trạng thái</th>
                            <th>Danh mục</th>
                            <th>Kích thước</th>
                            <th>Màu sắc</th>
                            <th>Thương hiệu</th>
                            <th>Thao tác</th>
                        </tr>
                        </thead>
                        <tbody>
                        <tr th:each="pd : ${productDetails}">
                            <td th:text="${pd.id}"></td>
                            <td th:text="${pd.product.name}"></td>
                            <td>
                                <img th:if="${pd.image != null}" th:src="@{${pd.image}}" alt="Product Image" width="50"
                                     height="50">
                                <span th:if="${pd.image == null}">No image</span>
                            </td>
                            <td th:text="${#numbers.formatCurrency(pd.price)}"></td>
                            <td th:text="${pd.quantity}"></td>
                            <td th:text="${#temporals.format(pd.createdDate, 'dd-MM-yyyy')}"></td>
                            <td th:text="${pd.available ? 'Đang kinh doanh' : 'Ngưng kinh doanh'}"></td>
                            <td th:text="${pd.category.name}"></td>
                            <td th:text="${pd.size.name}"></td>
                            <td th:text="${pd.color.name}"></td>
                            <td th:text="${pd.brand.name}"></td>
                            <td>
                                <button type="button" class="btn btn-primary btn-sm" data-bs-toggle="modal" data-bs-target="#updateProductDetailModal" th:data-id="${pd.id}">
                                    <i class="fas fa-edit"></i>
                                </button>

                                <a th:href="@{/admin/product-details/delete/{id}(id=${pd.id})}"
                                   class="btn btn-danger btn-sm"
                                   onclick="return confirm('Bạn có chắc chắn muốn xóa?')">
                                    <i class="fas fa-trash"></i>
                                </a>
                                <a th:href="@{/admin/product-details/detail/{id}(id=${pd.id})}"
                                   class="btn btn-info btn-sm">
                                    <i class="fas fa-eye"></i>
                                </a>
                            </td>
                        </tr>
                        </tbody>
                    </table>
                </div>
            </div>
        </div>
    </main>
    <!-- Footer code here -->
</div>

<!-- Modal -->
<div class="modal fade" id="addProductDetailModal" tabindex="-1" aria-labelledby="addProductDetailModalLabel" aria-hidden="true">
    <div class="modal-dialog modal-lg">
        <div class="modal-content">
            <div class="modal-header">
                <h5 class="modal-title" id="addProductDetailModalLabel">Add New Product Detail</h5>
                <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
            </div>
            <div class="modal-body">
                <form id="addProductDetailForm" th:object="${productDetail}" enctype="multipart/form-data">
                    <div class="row">
                        <div class="col-md-6">
                            <div class="mb-3">
                                <label for="product" class="form-label">Product:</label>
                                <select class="form-select" id="product" th:field="*{product}" required>
                                    <option value="">-- Select Product --</option>
                                    <option th:each="product : ${products}" th:value="${product.id}" th:text="${product.name}"></option>
                                </select>
                            </div>

                            <div class="mb-3">
                                <label for="imageFile" class="form-label">Image:</label>
                                <input type="file" class="form-control" id="imageFile" name="imageFile" accept="image/*" onchange="previewImage(this);">
                                <img id="preview" src="#" alt="Preview" style="max-width: 200px; display: none;">
                            </div>

                            <div class="mb-3">
                                <label for="price" class="form-label">Price:</label>
                                <input type="number" class="form-control" id="price" th:field="*{price}" placeholder="Enter price" required>
                            </div>
                            <div class="mb-3">
                                <label for="quantity" class="form-label">Quantity:</label>
                                <input type="number" class="form-control" id="quantity" th:field="*{quantity}" placeholder="Enter quantity" required>
                            </div>
                            <div class="mb-3">
                                <label for="createdDate" class="form-label">Created Date:</label>
                                <input type="datetime-local" class="form-control" id="createdDate" th:field="*{createdDate}" required>
                            </div>
                            <div class="mb-3">
                                <label for="available" class="form-label">Available:</label>
                                <select class="form-select" id="available" th:field="*{available}">
                                    <option value="true">Yes</option>
                                    <option value="false">No</option>
                                </select>
                            </div>
                        </div>
                        <div class="col-md-6">
                            <div class="mb-3">
                                <label for="category" class="form-label">Category:</label>
                                <select class="form-select" id="category" th:field="*{category}" required>
                                    <option value="">-- Select Category --</option>
                                    <option th:each="category : ${categories}" th:value="${category.id}" th:text="${category.name}"></option>
                                </select>
                            </div>
                            <div class="mb-3">
                                <label for="size" class="form-label">Size:</label>
                                <select class="form-select" id="size" th:field="*{size}" required>
                                    <option value="">-- Select Size --</option>
                                    <option th:each="size : ${sizes}" th:value="${size.id}" th:text="${size.name}"></option>
                                </select>
                            </div>
                            <div class="mb-3">
                                <label for="color" class="form-label">Color:</label>
                                <select class="form-select" id="color" th:field="*{color}" required>
                                    <option value="">-- Select Color --</option>
                                    <option th:each="color : ${colors}" th:value="${color.id}" th:text="${color.name}"></option>
                                </select>
                            </div>
                            <div class="mb-3">
                                <label for="brand" class="form-label">Brand:</label>
                                <select class="form-select" id="brand" th:field="*{brand}" required>
                                    <option value="">-- Select Brand --</option>
                                    <option th:each="brand : ${brands}" th:value="${brand.id}" th:text="${brand.name}"></option>
                                </select>
                            </div>
                        </div>
                    </div>
                    <button type="submit" class="btn btn-primary">Add Product Detail</button>
                </form>
            </div>
        </div>
    </div>
</div>
<!-- Update Product Detail Modal -->
<div class="modal fade" id="updateProductDetailModal" tabindex="-1" aria-labelledby="updateProductDetailModalLabel" aria-hidden="true">
    <div class="modal-dialog modal-lg">
        <div class="modal-content">
            <div class="modal-header">
                <h5 class="modal-title" id="updateProductDetailModalLabel">Edit Product Detail</h5>
                <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
            </div>
            <div class="modal-body">
                <form id="updateProductDetailForm" enctype="multipart/form-data">
                    <input type="hidden" id="updateId" name="id">
                    <div class="form-group">
                        <label for="updateProduct">Product:</label>
                        <select class="form-control" id="updateProduct" name="product">
                            <option th:each="product : ${products}" th:value="${product.id}" th:text="${product.name}"></option>
                        </select>
                    </div>
                    <div class="form-group">
                        <label for="updatePrice">Price:</label>
                        <input type="number" class="form-control" id="updatePrice" name="price" placeholder="Enter price">
                    </div>
                    <div class="form-group">
                        <label for="updateQuantity">Quantity:</label>
                        <input type="number" class="form-control" id="updateQuantity" name="quantity" placeholder="Enter quantity">
                    </div>
                    <div class="form-group">
                        <label for="updateCreatedDate">Created Date:</label>
                        <input type="datetime-local" class="form-control" id="updateCreatedDate" name="createdDate">
                    </div>
                    <div class="form-group">
                        <label for="updateAvailable">Available:</label>
                        <select class="form-control" id="updateAvailable" name="available">
                            <option value="true">Yes</option>
                            <option value="false">No</option>
                        </select>
                    </div>
                    <div class="form-group">
                        <label for="updateCategory">Category:</label>
                        <select class="form-control" id="updateCategory" name="category">
                            <option th:each="category : ${categories}" th:value="${category.id}" th:text="${category.name}"></option>
                        </select>
                    </div>
                    <div class="form-group">
                        <label for="updateSize">Size:</label>
                        <select class="form-control" id="updateSize" name="size">
                            <option th:each="size : ${sizes}" th:value="${size.id}" th:text="${size.name}"></option>
                        </select>
                    </div>
                    <div class="form-group">
                        <label for="updateColor">Color:</label>
                        <select class="form-control" id="updateColor" name="color">
                            <option th:each="color : ${colors}" th:value="${color.id}" th:text="${color.name}"></option>
                        </select>
                    </div>
                    <div class="form-group">
                        <label for="updateBrand">Brand:</label>
                        <select class="form-control" id="updateBrand" name="brand">
                            <option th:each="brand : ${brands}" th:value="${brand.id}" th:text="${brand.name}"></option>
                        </select>
                    </div>
                    <div class="form-group">
                        <label for="updateImageFile">Image:</label>
                        <input type="file" class="form-control-file" id="updateImageFile" name="imageFile" accept="image/*">
                    </div>
                    <div class="form-group">
                        <img id="updatePreviewImage" src="#" alt="Preview Image" style="max-width: 200px; display: none;">
                    </div>
                </form>
            </div>
            <div class="modal-footer">
                <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Close</button>
                <button type="submit" class="btn btn-primary" id="updateProductDetailBtn">Update</button>            </div>
        </div>
    </div>
</div>


<script th:src="@{/admin/js/scripts.js}"></script>
<script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>

<script src="https://cdn.jsdelivr.net/npm/simple-datatables@7.1.2/dist/umd/simple-datatables.min.js"
        crossorigin="anonymous"></script>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.2.3/dist/js/bootstrap.bundle.min.js"
        crossorigin="anonymous"></script>
<script th:src="@{/admin/js/datatables-simple-demo.js}"></script>
<script th:src="@{/admin/js/product-detail.js}"></script></body>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.2.3/dist/js/bootstrap.bundle.min.js" crossorigin="anonymous"></script>

</html>
