<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org" th:replace="~{/layout/layout.html :: dynamic(~{::title},~{::body})}">
<head>
    <meta charset="utf-8"/>
    <meta http-equiv="X-UA-Compatible" content="IE=edge"/>
    <meta name="viewport" content="width=device-width, initial-scale=1, shrink-to-fit=no"/>
    <meta name="description" content=""/>
    <meta name="author" content=""/>
    <title>Chi tiết sản phẩm</title>
    <link href="https://cdn.jsdelivr.net/npm/simple-datatables@7.1.2/dist/style.min.css" rel="stylesheet"/>
    <link th:href="@{/css/styles.css}" rel="stylesheet"/>
    <script src="https://use.fontawesome.com/releases/v6.3.0/js/all.js" crossorigin="anonymous"></script>
    <script src="/admin/js/product-detail.js"></script>
</head>
<body class="sb-nav-fixed">
<!-- Navbar and Sidebar code here -->

<div id="layoutSidenav_content">
    <main>
        <div class="container-fluid px-4">
            <h1 class="mt-4">Chi tiết sản phẩm</h1>
            <ol class="breadcrumb mb-4">
                <li class="breadcrumb-item"><a th:href="@{/admin}">Dashboard</a></li>
                <li class="breadcrumb-item active">Chi tiết sản phẩm</li>
            </ol>
            <div class="card mb-4">
                <div class="card-body">
                    <button class="btn btn-primary"><a th:href="@{/admin/product-details/add}"
                                                       class="btn btn-primary mb-3">Thêm chi tiết sản phẩm</a>
                    </button>
                    <table id="datatablesSimple">
                        <thead>
                        <tr>
                            <th>ID</th>
                            <th>Sản phẩm</th>
                            <th>Hình ảnh</th>
                            <th>Giá</th>
                            <th>Số lượng</th>
                            <th>Ngày tạo</th>
                            <th>Trạng thái</th>
                            <th>Danh mục</th>
                            <th>Kích thước</th>
                            <th>Màu sắc</th>
                            <th>Thương hiệu</th>
                            <th>Thao tác</th>
                        </tr>
                        </thead>
                        <tbody>
                        <tr th:each="pd : ${productDetails}">
                            <td th:text="${pd.id}"></td>
                            <td th:text="${pd.product.name}"></td>
                            <td>
                                <img th:if="${pd.image != null}" th:src="@{${pd.image}}" alt="Product Image" width="50"
                                     height="50">
                                <span th:if="${pd.image == null}">No image</span>
                            </td>
                            <td th:text="${#numbers.formatCurrency(pd.price)}"></td>
                            <td th:text="${pd.quantity}"></td>
                            <td th:text="${#temporals.format(pd.createdDate, 'dd-MM-yyyy')}"></td>
                            <td th:text="${pd.available ? 'Đang kinh doanh' : 'Ngưng kinh doanh'}"></td>
                            <td th:text="${pd.category.name}"></td>
                            <td th:text="${pd.size.name}"></td>
                            <td th:text="${pd.color.name}"></td>
                            <td th:text="${pd.brand.name}"></td>
                            <td>
                                <a th:href="@{/admin/product-details/edit/{id}(id=${pd.id})}"
                                   class="btn btn-primary btn-sm">
                                    <i class="fas fa-edit"></i>
                                </a>
                                <a th:href="@{/admin/product-details/delete/{id}(id=${pd.id})}"
                                   class="btn btn-danger btn-sm"
                                   onclick="return confirm('Bạn có chắc chắn muốn xóa?')">
                                    <i class="fas fa-trash"></i>
                                </a>
                                <a th:href="@{/admin/product-details/detail/{id}(id=${pd.id})}"
                                   class="btn btn-info btn-sm">
                                    <i class="fas fa-eye"></i>
                                </a>
                            </td>
                        </tr>
                        </tbody>
                    </table>
                </div>
            </div>
        </div>
    </main>
    <!-- Footer code here -->
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.2.3/dist/js/bootstrap.bundle.min.js"
        crossorigin="anonymous"></script>
<script th:src="@{/js/scripts.js}"></script>
<script src="https://cdn.jsdelivr.net/npm/simple-datatables@7.1.2/dist/umd/simple-datatables.min.js"
        crossorigin="anonymous"></script>
<script th:src="@{/js/datatables-simple-demo.js}"></script>
<script th:src="@{/admin/js/product-detail.js}"></script></body>
</html>
