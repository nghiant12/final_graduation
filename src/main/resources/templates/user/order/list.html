<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      th:replace="~{/layout/layout.html :: dynamic(~{::title},~{::body})}">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Danh sách đơn hàng</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.2.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

</head>
<body>
    <div class="container py-5">
        <h2 class="mb-4">Danh sách đơn hàng của bạn</h2>
        
        <div th:if="${orders.empty}" class="alert alert-info">
            Bạn chưa có đơn hàng nào.
        </div>
        
        <div th:each="order : ${orders}" class="order-card p-4">
            <div class="row">
                <div class="col-md-3">
                    <h5>Mã đơn hàng: #<span th:text="${order.id}"></span></h5>
                    <p class="text-muted">
                        <i class="fas fa-calendar-alt"></i>
                        <span th:text="${#temporals.format(order.createdDate, 'dd/MM/yyyy HH:mm')}"></span>
                    </p>
                </div>
                <div class="col-md-3">
                    <p><strong>Địa chỉ:</strong></p>
                    <p th:text="${order.address}"></p>
                </div>
                <div class="col-md-3">
                    <p><strong>Trạng thái:</strong></p>
                    <span th:class="'status-badge ' + 'status-' + ${#strings.toLowerCase(order.status)}"
                          th:text="${order.status == 'PENDING_CONFIRMATION' ? 'Chờ xác nhận' :
                                   order.status == 'CONFIRMED' ? 'Đã xác nhận' :
                                   order.status == 'PREPARING' ? 'Đang chuẩn bị' :
                                   order.status == 'SHIPPING' ? 'Đang giao hàng' :
                                   order.status == 'COMPLETED' ? 'Hoàn thành' :
                                   order.status == 'CANCELLED' ? 'Đã hủy' : order.status}">
                    </span>
                </div>
                <div class="col-md-3 text-end">
                    <a th:href="@{'/order/detail/' + ${order.id}}" class="btn btn-primary">
                        <i class="fas fa-eye"></i> Xem chi tiết
                    </a>
                </div>
            </div>
            <div class="order-breakdown mt-2">
                <p>Tiền hàng: <b th:text="${#numbers.formatDecimal(order.subTotal, 0, 'COMMA', 0, 'POINT')} + ' VND'"></b></p>
                <p>Phí vận chuyển: <b th:text="${#numbers.formatDecimal(order.shippingFee, 0, 'COMMA', 0, 'POINT')} + ' VND'"></b></p>
                <p>Giảm giá: <b class="text-success" th:text="|-${#numbers.formatDecimal(order.discountAmount, 0, 'COMMA', 0, 'POINT')} VND|"></b></p>
                <p class="fw-bold">Tổng thanh toán: <b class="text-primary" th:text="${#numbers.formatDecimal(order.totalPrice, 0, 'COMMA', 0, 'POINT')} + ' VND'" ></b></p>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.2.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
